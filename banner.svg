<svg width="900" height="180" viewBox="0 0 900 180" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>jambalong banner</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="55%" stop-color="#4C3F91"/>
      <stop offset="100%" stop-color="#7B3FA0"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 0.5 0.5" to="360 0.5 0.5" dur="26s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- non-rectangular banner shape: clipped corners -->
  <polygon points="0,0 868,0 900,32 900,180 32,180 0,148" fill="url(#bg)"/>

  <!-- diagonal accent bands, slow breathing -->
  <polygon points="600,0 900,0 900,180 700,180" fill="#ffffff" opacity="0.06">
    <animate attributeName="opacity" values="0.04;0.09;0.04" dur="9s" repeatCount="indefinite"/>
  </polygon>
  <polygon points="650,0 900,0 900,120 760,180 680,180" fill="#ffffff" opacity="0.04">
    <animate attributeName="opacity" values="0.03;0.07;0.03" dur="7s" repeatCount="indefinite"/>
  </polygon>

  <!-- connected node motif: ties the different disciplines into one network -->
  <g stroke="#ffffff" stroke-width="1.6" fill="none">
    <line x1="762" y1="52" x2="822" y2="42" stroke-dasharray="6 5" opacity="0.7">
      <animate attributeName="stroke-dashoffset" from="0" to="-22" dur="1.4s" repeatCount="indefinite"/>
    </line>
    <line x1="822" y1="42" x2="852" y2="82" stroke-dasharray="6 5" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="0" to="-22" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="852" y1="82" x2="802" y2="102" stroke-dasharray="6 5" opacity="0.65">
      <animate attributeName="stroke-dashoffset" from="0" to="-22" dur="1.3s" repeatCount="indefinite"/>
    </line>
    <line x1="802" y1="102" x2="762" y2="52" stroke-dasharray="6 5" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="0" to="-22" dur="1.5s" repeatCount="indefinite"/>
    </line>
    <line x1="802" y1="102" x2="742" y2="112" stroke-dasharray="6 5" opacity="0.65">
      <animate attributeName="stroke-dashoffset" from="0" to="-22" dur="1.2s" repeatCount="indefinite"/>
    </line>
    <line x1="802" y1="102" x2="792" y2="142" stroke-dasharray="6 5" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="0" to="-22" dur="1.7s" repeatCount="indefinite"/>
    </line>
    <line x1="742" y1="112" x2="792" y2="142" stroke-dasharray="6 5" opacity="0.55">
      <animate attributeName="stroke-dashoffset" from="0" to="-22" dur="1.5s" repeatCount="indefinite"/>
    </line>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
  </g>
  <g fill="#ffffff">
    <circle cx="762" cy="52" r="5">
      <animate attributeName="r" values="3.5;8;3.5" dur="2s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="52;46;52" dur="4s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="822" cy="42" r="4">
      <animate attributeName="r" values="2.5;7;2.5" dur="2s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="42;36;42" dur="4.5s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="852" cy="82" r="4.5">
      <animate attributeName="r" values="3;7.5;3" dur="2s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="852;858;852" dur="4s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="802" cy="102" r="6" opacity="0.95">
      <animate attributeName="r" values="4.5;9.5;4.5" dur="2s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="742" cy="112" r="4">
      <animate attributeName="r" values="2.5;7;2.5" dur="2s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="112;118;112" dur="4.2s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="792" cy="142" r="4.5">
      <animate attributeName="r" values="3;7.5;3" dur="2s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="142;148;142" dur="4.4s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- left-aligned text block -->
  <text x="60" y="80" text-anchor="start" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="40" font-weight="600" fill="#ffffff">jambalong</text>
  <text x="60" y="108" text-anchor="start" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#ffffff">Systems, code, security.</text>

  <!-- connecting thread beneath the tags, tying the disciplines together -->
  <line x1="60" y1="159" x2="570" y2="159" stroke="url(#line)" stroke-width="1.5">
    <animate attributeName="x1" values="60;80;60" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="570;590;570" dur="6s" repeatCount="indefinite"/>
  </line>

  <!-- three grouped pills instead of six loose tags: stack, path, and person -->
  <g font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#ffffff" text-anchor="middle">
    <g>
      <rect x="60" y="128" width="212" height="24" rx="12" fill="#ffffff" opacity="0.15">
        <animate attributeName="opacity" values="0.12;0.22;0.12" dur="5s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <text x="166" y="144">Software Support Engineer</text>
    </g>
    <g>
      <rect x="286" y="128" width="170" height="24" rx="12" fill="#ffffff" opacity="0.15">
        <animate attributeName="opacity" values="0.12;0.22;0.12" dur="5s" begin="0.5s" repeatCount="indefinite"/>
      </rect>
      <text x="371" y="144">C# · Ruby · DevOps</text>
    </g>
    <g>
      <rect x="470" y="128" width="90" height="24" rx="12" fill="#ffffff" opacity="0.15">
        <animate attributeName="opacity" values="0.12;0.22;0.12" dur="5s" begin="1s" repeatCount="indefinite"/>
      </rect>
      <text x="515" y="144">Gamer</text>
    </g>
  </g>
</svg>
